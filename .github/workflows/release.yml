# Builds FileTypeConverter.exe and publishes it as a GitHub Release
# whenever you push a version tag, e.g.:  git tag v0.1.0  then  git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # lets this workflow create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app, its test tools and PyInstaller
        run: pip install -e ".[dev,build]"

      # never release a version whose tests fail
      - name: Run the tests
        run: pytest

      - name: Build the .exe
        run: pyinstaller --noconfirm FileTypeConverter.spec

      # gh is GitHub's own command-line tool, already installed on GitHub's computers
      - name: Publish the release with the .exe attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/FileTypeConverter.exe
          --title "File Type Converter ${{ github.ref_name }}"
          --generate-notes
