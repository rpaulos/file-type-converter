# Runs the tests on GitHub's computers every time you push to main or open a pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    # run the whole job twice: once on the oldest Python we support, once on a newer one
    strategy:
      fail-fast: false        # if one version fails, still finish the other
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                          # reuse downloads from earlier runs
          cache-dependency-path: pyproject.toml

      - name: Install the app and its test tools
        run: pip install -e ".[dev]"

      # -rs lists the skipped tests and why (GitHub's computers don't have Word)
      - name: Run the tests
        run: pytest -rs
