[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-type-converter"
version = "0.1.0"
description = "A desktop app that converts files between formats."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "pywin32>=306; sys_platform == 'win32'",
]


[project.scripts]
fconvert = "file_converter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
file-converter = "file_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# non-Python files that belong to the package
[tool.setuptools.package-data]
file_converter = ["icon.ico"]